<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project</title>
  <link rel="stylesheet" href="./src/main.css">
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <form class="form" id="login" method="POST">
      <h1 class="form_title">Login</h1>
      <div class="form_input_group">
        <input type="text" class="form_input" name="username" placeholder="Username" required>
      </div>
      <div class="form_input_group">
        <input type="password" class="form_input" name="password" placeholder="Password" required>
      </div>
      <div class="form_message"></div>
      <button class="form__button" type="submit">Login</button>
      <p class="form_text">
        <a id="linkcreateform" class="form__link">Don't have an account? Create account</a>
      </p>
    </form>

    <!-- Register Form -->
    <form class="form form--hidden" id="createaccount" method="POST">
      <h1 class="form_title">Create account</h1>
      <div class="form_input_group">
        <input type="text" class="form_input" id="signup_username" name="username" placeholder="Username" required>
        <div class="forminput__errormessage"></div>
      </div>
      <div class="form_input_group">
        <input type="email" class="form_input" name="email" placeholder="Email address" required>
      </div>
      <div class="form_input_group">
        <input type="password" class="form_input" id="signup_password1" name="password1" placeholder="Password" required>
        <div class="forminput__errormessage"></div>
      </div>
      <div class="form_input_group">
        <input type="password" class="form_input" id="signup_password2" name="password2" placeholder="Confirm password" required>
        <div class="forminput__errormessage"></div>
      </div>
      <button class="form__button" type="submit">Create Account</button>
      <p class="form_text">
        <a id="linkloginform" class="form__link">Already have an account?</a>
      </p>
    </form>
  </div>
  <script src="./src/main.js"></script>
</body>
</html>
